name: watch

on:
  schedule:
    # Every 2 hours at :17 (keep in sync with schedule.run_interval_hours in config.yaml).
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit state/ and WATCHLIST.md back
  issues: write     # one issue per alert

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        run: python -m watcher
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}

      - name: Save state
        if: always()
        run: |
          git config user.name "auction-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state WATCHLIST.md
          git diff --cached --quiet && exit 0
          git commit -m "Update watcher state [skip ci]"
          git push
